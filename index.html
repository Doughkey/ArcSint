<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Asia Arc War Room</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,600&display=swap" rel="stylesheet">
<style>
:root{--paper:#EEF0EA;--panel:#F7F8F4;--ink:#17262E;--muted:#5D6B70;--sea:#D3DFE0;--rule:#CAD1CB;--teal:#1F5F6B;--hot:#B4532A}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:-ms-grid;display:grid;grid-template-rows:auto 1fr;background:var(--paper);color:var(--ink);font:15px/1.45 "Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px;padding:10px 16px;border-bottom:1px solid var(--rule)}
h1{font-size:21px;margin:0;font-weight:700}
.pill{font-size:12.5px;color:var(--muted);border:1px solid var(--rule);border-radius:99px;padding:2px 10px;background:var(--panel)}
.pill b{color:var(--ink);font-weight:600}
.sp{flex:1}
button,input{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--paper);padding:5px 14px;border-radius:4px}
main{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(380px,1fr);min-height:0}
#mapwrap{position:relative;min-height:320px}
#map{position:absolute;top:0;right:0;bottom:0;left:0;background:var(--sea)}
#layers{position:absolute;z-index:1000;top:10px;right:10px;background:rgba(247,248,244,.94);border:1px solid var(--rule);border-radius:6px;padding:8px 10px;font-size:13px;display:grid;gap:4px}
#layers label{display:flex;align-items:center;gap:6px;cursor:pointer}
.sw{width:10px;height:10px;display:inline-block}
aside{display:flex;flex-direction:column;min-height:0;border-left:1px solid var(--rule);background:var(--panel)}
.controls{padding:10px 14px;border-bottom:1px solid var(--rule);display:grid;gap:8px}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.lbl{font-size:13px;color:var(--muted);min-width:56px}
.chip{border:1px solid var(--rule);background:transparent;padding:2px 10px;border-radius:99px;font-size:13px}
.chip[aria-pressed=true]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:var(--c)}
#q{width:100%;padding:6px 10px;border:1px solid var(--rule);border-radius:4px;background:#fff}
#mix{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--rule)}
#mix span{display:block;height:100%}
#mixnote{font-size:12.5px;color:var(--muted);margin-top:3px}
#sel{display:none;font-size:13px}
#sel button{border:0;background:none;color:var(--teal);text-decoration:underline;padding:0 4px}
.tabs{display:flex;border-bottom:1px solid var(--rule)}
.tab{flex:1;border:0;background:none;padding:8px;border-bottom:3px solid transparent;font-weight:600;color:var(--muted)}
.tab[aria-selected=true]{color:var(--ink);border-bottom-color:var(--hot)}
#pane{overflow-y:auto;flex:1;min-height:0}
ul.feed{list-style:none;margin:0;padding:0}
.feed li{padding:11px 14px;border-bottom:1px solid var(--rule);border-left:3px solid var(--c)}
.feed a{font-family:Newsreader,Georgia,serif;font-size:17px;line-height:1.3;color:var(--ink);text-decoration:none;font-weight:600}
.feed a:hover{text-decoration:underline}
.meta{font-size:12.5px;color:var(--muted);margin-top:4px;display:flex;flex-wrap:wrap;gap:2px 10px}
.meta .src{color:var(--c);font-weight:600}
.sum{font-size:13.5px;color:#34434A;margin:4px 0 0}
.empty{padding:22px 16px;color:var(--muted)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{text-align:left;font-weight:600;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--rule);position:sticky;top:0;background:var(--panel)}
td{padding:7px 10px;border-bottom:1px solid var(--rule)}
tr.go{cursor:pointer}tr.go:hover{background:#ECEFE8}
.up{color:var(--hot);font-weight:600}.dn{color:var(--teal)}
details{padding:8px 14px;font-size:12.5px;color:var(--muted);border-top:1px solid var(--rule)}
.bs{width:11px;height:11px;border:2px solid #fff;box-shadow:0 0 0 1px #17262E}
.g-West{background:#2F6DA3}.g-China{background:#C0392B}.g-Russia{background:#7A5A2E}.g-Regional{background:#5B6B73}
.ac span{display:block;font-size:14px;line-height:14px;color:#17262E;text-shadow:0 0 3px #fff,0 0 3px #fff}
@media(max-width:820px){body{height:auto}main{grid-template-columns:1fr}#mapwrap{height:48vh}aside{border-left:0;height:85vh}}
</style>
</head>
<body>
<header>
  <h1>Asia Arc War Room</h1>
  <span class="pill">UTC <b id="clock">--:--:--</b></span>
  <span class="pill">Reports <b id="pNews">loading</b></span>
  <span class="pill">Aircraft <b id="pAir">loading</b></span>
  <span class="pill">Network <b id="net">checking</b></span>
  <span class="sp"></span>
  <button class="btn" id="refresh">Refresh now</button>
</header>
<main>
  <div id="mapwrap">
    <div id="map"></div>
    <div id="layers">
      <label><input type="checkbox" data-l="rep" checked><span class="sw" style="background:#B4532A;border-radius:50%"></span>Reports</label>
      <label><input type="checkbox" data-l="base" checked><span class="sw" style="background:#2F6DA3"></span>Bases and outposts</label>
      <label><input type="checkbox" data-l="air" checked><span>&#9650;</span>Military aircraft</label>
    </div>
  </div>
  <aside>
    <div class="controls">
      <div class="row"><span class="lbl">Region</span><span class="row" id="theatres"></span></div>
      <div class="row"><span class="lbl">Period</span><span class="row" id="ages"></span></div>
      <div class="row"><span class="lbl">Sources</span><span class="row" id="leans"></span></div>
      <input id="q" type="search" placeholder="Search headlines or places" aria-label="Search">
      <div><div id="mix" aria-hidden="true"></div><div id="mixnote"></div></div>
      <div id="sel"></div>
    </div>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" data-p="feed">Feed</button>
      <button class="tab" role="tab" data-p="track">Conflict tracker</button>
      <button class="tab" role="tab" data-p="units">Air units</button>
    </div>
    <div id="pane"></div>
    <details><summary>Feed diagnostics</summary><div id="diag"></div></details>
  </aside>
</main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

async function tf(url,ms){

// ---------- news ----------
function add(list){
  list.forEach(function(r){
    var text=r.title+' '+(r.summary||'')+' ',idx=[];
    RX.forEach(function(x,n){if(x.test(text))idx.push(n)});
    var key=r.title.toLowerCase().slice(0,70);
    if(!idx.length||seen[key])return;
    seen[key]=1;
    var kd='other';for(var i=0;i<KINDS.length;i++){if(KINDS[i][1].test(text)){kd=KINDS[i][0];break}}
    var ths=[];idx.forEach(function(n){if(ths.indexOf(PL[n][3])<0)ths.push(PL[n][3])});
    r.summary=r.summary||'';r.kind=kd;r.places=idx.map(function(n){return PL[n][0]});r.theatres=ths;items.push(r);
  });
  items.sort(function(a,b){return b.t-a.t});
}
function parseXml(xml){
  var d=new DOMParser().parseFromString(xml,'text/xml'),out=[],els=d.querySelectorAll('item,entry');
  for(var i=0;i<els.length;i++){
    var e=els[i],g=function(n){var x=e.querySelector(n);return x?x.textContent:''};
    var l=e.querySelector('link'),link=l?(l.getAttribute('href')||l.textContent||'').trim():'';
    var t=Date.parse(g('pubDate')||g('published')||g('updated'));
    out.push({title:clean(g('title')),link:link,summary:clean(g('description')||g('summary')||g('content')).slice(0,320),t:isNaN(t)?0:t});
  }
  return out;
}
async function pullRss(s){
  for(var i=0;i<PROX.length;i++){
    try{
      var r=await tf(PROX[i](s[1]),10000);
      if(!r.ok)continue;
      var l=parseXml(await r.text());
      if(l.length)return l;
    }catch(e){}
  }
  // Last-resort JSON feed converter.
  try{
    var r2=await tf('https://api.rss2json.com/v1/api.json?rss_url='+encodeURIComponent(s[1]),10000);
    if(!r2.ok)throw new Error('HTTP '+r2.status);
    var j=await r2.json();
    if(j.items&&j.items.length)return j.items.map(function(x){
      return {title:clean(x.title),link:x.link,summary:clean(x.description).slice(0,320),
        t:Date.parse(String(x.pubDate||'').replace(' ','T')+'Z')||0};
    });
  }catch(e){}
  return null;
}
async function rssAll(){

      var s=SRC[i++],l=await pullRss(s);
      if(l){add(l.map(function(r){r.source=s[0];r.lean=s[2];return r}));DG[s[0]]='ok, '+l.length+' items'}else DG[s[0]]='failed (all relays)';
      sched();
    }
  }
  await Promise.all([worker(),worker(),worker(),worker(),worker(),worker()]);
}
function gd(s){return Date.UTC(+s.slice(0,4),+s.slice(4,6)-1,+s.slice(6,8),+s.slice(9,11),+s.slice(11,13),+s.slice(13,15))}
async function gdeltAll(){
  for(var i=0;i<GQ.length;i++){
    var name='GDELT '+GQ[i][0];
    try{
      var u='https://api.gdeltproject.org/api/v2/doc/doc?query='+encodeURIComponent(GQ[i][1]+' sourcelang:english')+'&mode=ArtList&maxrecords=120&timespan=7d&format=json&sort=DateDesc';
      var r=await tf(u,25000),j=JSON.parse(await r.text()),a=j.articles||[];
      add(a.map(function(x){return {title:clean(x.title),link:x.url,summary:'',t:x.seendate?gd(x.seendate):0,source:x.domain||'GDELT',lean:leanOf(x.domain)}}));
      DG[name]='ok, '+a.length+' items';
    }catch(e){DG[name]='failed'}
    sched();
    if(i<GQ.length-1)await sleep(5500); // GDELT allows about one request per 5 seconds
  }
}
async function loadNews(){
  $('pNews').textContent='updating';
  await Promise.all([rssAll(),gdeltAll()]);
  newsAt=Date.now();
  try{localStorage.setItem('arc2',JSON.stringify(items.slice(0,500)))}catch(e){}
  render();
}

// ---------- aircraft ----------
async function loadAir(){
  // Try several public ADS-B sources. We normalize their different response
  // shapes into the fields already used by this dashboard.
  var sources=[
    {
      name:'ADS-B.lol',
      url:'https://api.adsb.lol/v2/mil',
      parse:function(j){return j.ac||[]}
    },
    {
      name:'Airplanes.live',
      url:'https://api.airplanes.live/v2/mil',
      parse:function(j){return j.ac||j.aircraft||[]}
    },
    {
      name:'OpenSky',
      url:'https://opensky-network.org/api/states/all?lamin=-11&lomin=25&lamax=52&lomax=150',
      parse:function(j){
        return (j.states||[]).map(function(x){
          return {
            hex:x[0],flight:x[1],lat:x[6],lon:x[5],alt_baro:x[7],
            gs:x[9],track:x[10],r:x[1],t:''
          };
        });
      }
    }
  ];
  var merged={},ok=[];
  for(var i=0;i<sources.length;i++){
    try{
      var r=await tf(sources[i].url,18000);
      if(!r.ok)throw new Error('HTTP '+r.status);
      var j=await r.json(),l=sources[i].parse(j)||[];
      l.forEach(function(a){
        if(typeof a.lat!=='number'||typeof a.lon!=='number')return;
        if(a.lat<=-11||a.lat>=52||a.lon<=25||a.lon>=150)return;
        var id=String(a.hex||a.icao24||a.flight||a.r||'').trim();
        var key=id||([a.lat.toFixed(3),a.lon.toFixed(3)].join(','));
        if(!merged[key])merged[key]=a;
      });
      ok.push(sources[i].name+': '+l.length);
    }catch(e){
      DG[sources[i].name]='failed: '+(e.message||'unavailable');
    }
  }
  AC=Object.keys(merged).map(function(k){return merged[k]});
  if(AC.length||ok.length){
    airAt=Date.now();
    DG['Military aircraft']=ok.length?'ok — '+ok.join(', ')+'; merged '+AC.length:'no usable aircraft';
    drawAir();
  }else{
    DG['Military aircraft']='all public feeds failed';
    $('pAir').textContent='unavailable';
    renderDiag();
  }
}
function near(lat,lon){
  var b=null,bd=1e9;
  PL.forEach(function(p){var d=Math.pow(p[1]-lat,2)+Math.pow((p[2]-lon)*Math.cos(lat*Math.PI/180),2);if(d<bd){bd=d;b=p}});
  return bd<64?b:null;
}
function drawAir(){
  if(!mapReady||!gAir||typeof L==='undefined')return;
  gAir.clearLayers();
  AC.forEach(function(a){
    var id=(a.flight||a.r||a.hex||'').trim(),tip='<b>'+esc(id||'unknown')+'</b><br>'+esc((a.t||'')+' '+(a.r||''))+'<br>Alt '+esc(a.alt_baro||'n/a')+' ft, '+esc(a.gs?Math.round(a.gs):'n/a')+' kn';
    L.marker([a.lat,a.lon],{icon:L.divIcon({className:'ac',html:'<span style="transform:rotate('+(a.track||0)+'deg)">&#9650;</span>',iconSize:[14,14]})}).bindTooltip(tip).addTo(gAir);
  });
  $('pAir').textContent=AC.length+' tracked';
  if(tab==='units')renderPane();
  renderDiag();
}

// ---------- rendering ----------
var sch=0;function sched(){clearTimeout(sch);sch=setTimeout(render,400)}
function ago(t){if(!t)return 'undated';var m=(Date.now()-t)/6e4;return m<60?Math.max(1,m|0)+' min ago':m<1440?(m/60|0)+' h ago':(m/1440|0)+' d ago'}
function base(){
  var cut=Date.now()-age*36e5;
  return items.filter(function(i){return (!i.t||i.t>cut)&&(th==='All'||i.theatres.indexOf(th)>-1)&&leans[i.lean]&&(!q||(i.title+' '+i.summary).toLowerCase().indexOf(q)>-1)});
}
function chips(){
  $('theatres').innerHTML=Object.keys(TH).map(function(t){return '<button class="chip" data-t="'+esc(t)+'" aria-pressed="'+(t===th)+'">'+esc(t)+'</button>'}).join('');
  $('ages').innerHTML=Object.keys(AGES).map(function(n){return '<button class="chip" data-a="'+AGES[n]+'" aria-pressed="'+(AGES[n]===age)+'">'+n+'</button>'}).join('');
  $('leans').innerHTML=Object.keys(LEAN).map(function(k){return '<button class="chip" data-l="'+k+'" style="--c:'+LEAN[k][1]+'" aria-pressed="'+!!leans[k]+'"><i></i>'+LEAN[k][0]+'</button>'}).join('');
  Array.prototype.forEach.call(document.querySelectorAll('.tab'),function(b){b.setAttribute('aria-selected',b.dataset.p===tab)});
}
function feedHtml(v){
  if(!v.length)return '<div class="empty">'+(newsAt?'Nothing matches these filters. Try a longer period or a wider region.':'Loading reports. The first results usually appear within 15 seconds.')+'</div>';
  return '<ul class="feed">'+v.slice(0,150).map(function(i){return '<li style="--c:'+LEAN[i.lean][1]+'"><a href="'+esc(i.link)+'" target="_blank" rel="noopener noreferrer">'+esc(i.title)+'</a>'+(i.summary?'<p class="sum">'+esc(i.summary.slice(0,200))+(i.summary.length>200?'...':'')+'</p>':'')+'<div class="meta"><span class="src">'+esc(i.source)+' ('+LEAN[i.lean][0]+')</span><span>'+ago(i.t)+'</span><span>'+esc(i.kind)+'</span><span>'+esc(i.places.join(', '))+'</span></div></li>'}).join('')+'</ul>';
}
function trackHtml(){
  var now=Date.now(),h=36e5,rows=PL.filter(function(p){return th==='All'||p[3]===th}).map(function(p){
    var c24=0,p24=0,c7=0;
    items.forEach(function(i){if(i.places.indexOf(p[0])<0||!leans[i.lean])return;if(!i.t){c7++;return}var d=now-i.t;if(d<168*h)c7++;if(d<24*h)c24++;else if(d<48*h)p24++});
    return {p:p,c24:c24,p24:p24,c7:c7};
  }).sort(function(a,b){return b.c24-a.c24||b.c7-a.c7});
  return '<table><tr><th>Hotspot</th><th>24 h</th><th>Trend</th><th>7 days</th></tr>'+rows.map(function(r){
    var t=r.c24>r.p24?'<span class="up">&#9650; up</span>':r.c24<r.p24?'<span class="dn">&#9660; down</span>':'steady';
    return '<tr class="go" data-pl="'+esc(r.p[0])+'"><td>'+esc(r.p[0])+'</td><td>'+r.c24+'</td><td>'+t+'</td><td>'+r.c7+'</td></tr>'}).join('')+'</table>';
}
function unitsHtml(){
  if(!airAt)return '<div class="empty">'+($('pAir').textContent==='unavailable'?'The aircraft feed did not respond. It retries every 30 seconds.':'Loading aircraft.')+'</div>';
  var rows=AC.map(function(a){return {a:a,n:near(a.lat,a.lon)}}).filter(function(r){return th==='All'||(r.n&&r.n[3]===th)});
  if(!rows.length)return '<div class="empty">No military-tagged aircraft are broadcasting in this region right now. Coverage depends on volunteer receivers, and many military flights are not visible.</div>';
  return '<table><tr><th>Callsign</th><th>Type</th><th>Alt (ft)</th><th>Speed</th><th>Near</th></tr>'+rows.slice(0,80).map(function(r){var a=r.a;
    return '<tr class="go" data-ll="'+a.lat+','+a.lon+'"><td>'+esc((a.flight||a.r||a.hex||'').trim())+'</td><td>'+esc(a.t||'')+'</td><td>'+esc(a.alt_baro||'')+'</td><td>'+(a.gs?Math.round(a.gs)+' kn':'')+'</td><td>'+esc(r.n?r.n[0]:'')+'</td></tr>'}).join('')+'</table>';
}
function renderPane(){
  var v=base();if(place)v=v.filter(function(i){return i.places.indexOf(place)>-1});
  $('pane').innerHTML=tab==='feed'?feedHtml(v):tab==='track'?trackHtml():unitsHtml();
}
function renderDiag(){$('diag').innerHTML=Object.keys(DG).map(function(k){return esc(k)+': '+esc(DG[k])}).join('<br>')||'Waiting for first responses.'}
function render(){
  chips();
  var b=base(),v=place?b.filter(function(i){return i.places.indexOf(place)>-1}):b,counts={};
  b.forEach(function(i){i.places.forEach(function(p){counts[p]=(counts[p]||0)+1})});
  if(mapReady&&gRep&&typeof L!=='undefined'){
    gRep.clearLayers();
  }
  PL.forEach(function(p){var n=counts[p[0]];if(!n)return;
    if(mapReady&&gRep&&typeof L!=='undefined'){
      L.circleMarker([p[1],p[2]],{radius:6+Math.sqrt(n)*3,color:p[0]===place?'#17262E':'#B4532A',weight:p[0]===place?3:1.5,fillColor:'#B4532A',fillOpacity:.35})
        .bindTooltip(p[0]+': '+n+' reports').on('click',function(){place=place===p[0]?null:p[0];render()}).addTo(gRep);
    }
  });
  var mix={};v.forEach(function(i){mix[i.lean]=(mix[i.lean]||0)+1});
  $('mix').innerHTML=Object.keys(LEAN).map(function(k){return mix[k]?'<span style="width:'+mix[k]/v.length*100+'%;background:'+LEAN[k][1]+'" title="'+LEAN[k][0]+': '+mix[k]+'"></span>':''}).join('');
  $('mixnote').textContent=v.length?'Who is reporting: '+Object.keys(LEAN).filter(function(k){return mix[k]}).map(function(k){return LEAN[k][0]+' '+mix[k]}).join(', '):'';
  $('sel').style.display=place?'block':'none';
  if(place)$('sel').innerHTML='Showing <b>'+esc(place)+'</b><button>Clear</button>';
  $('pNews').textContent=items.length?items.length+(newsAt?'':' (loading)'):'loading';
  renderPane();renderDiag();
}

// ---------- events ----------
$('theatres').onclick=function(e){var t=e.target.dataset.t;if(!t)return;th=t;place=null;if(mapReady)map.setView(TH[t][0],TH[t][1]);render()};
$('ages').onclick=function(e){var a=e.target.dataset.a;if(!a)return;age=+a;render()};
$('leans').onclick=function(e){var b=e.target.closest('[data-l]');if(!b)return;leans[b.dataset.l]=!leans[b.dataset.l];render()};
$('q').oninput=function(e){q=e.target.value.toLowerCase();render()};
$('sel').onclick=function(e){if(e.target.tagName==='BUTTON'){place=null;render()}};
document.querySelector('.tabs').onclick=function(e){if(e.target.dataset.p){tab=e.target.dataset.p;render()}};
$('pane').onclick=function(e){
  var tr=e.target.closest('tr.go');if(!tr)return;
  if(tr.dataset.pl){place=tr.dataset.pl;tab='feed';if(mapReady)PL.forEach(function(p){if(p[0]===place)map.setView([p[1],p[2]],6)});render()}
  else if(tr.dataset.ll){var c=tr.dataset.ll.split(',');if(mapReady)map.setView([+c[0],+c[1]],7)}
};
$('layers').onchange=function(e){
  var k=e.target.dataset.l,g={rep:gRep,base:gBase,air:gAir}[k];
  vis[k]=e.target.checked;
  if(!mapReady||!g)return;
  if(e.target.checked)map.addLayer(g);else map.removeLayer(g);
};
$('refresh').onclick=function(){loadNews();loadAir()};
window.addEventListener('error',function(e){
  var msg=e&&e.message?e.message:'unknown error';
  if($('pNews'))$('pNews').textContent='script error';
  DG['JavaScript']='error: '+msg;
  if(typeof renderDiag==='function')renderDiag();
});

// ---------- start ----------
try{var c=JSON.parse(localStorage.getItem('arc2')||'[]');c.forEach(function(i){var k=i.title.toLowerCase().slice(0,70);if(!seen[k]){seen[k]=1;items.push(i)}})}catch(e){}
initMap();
networkState();
setInterval(function(){$('clock').textContent=new Date().toISOString().slice(11,19)},1000);
setInterval(function(){if(navigator.onLine!==false)loadAir()},30000);
setInterval(function(){if(navigator.onLine!==false)loadNews()},5*60*1000);
setInterval(render,60000);
render();loadAir();loadNews();
})();
</script>
</body>
</html>
